name: kanso-dashboard

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
    container_name: kanso-dashboard-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8081}:8080'
