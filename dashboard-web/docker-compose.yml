# Nom de projet par défaut ; override avec `COMPOSE_PROJECT_NAME=...` pour
# faire tourner une deuxième instance isolée en parallèle (conteneur dérivé de
# ce nom, donc pas de collision — voir KansoOS/Makefile).
name: kanso-dashboard-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-true}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${WEB_PORT:-8081}:5173'
    volumes:
      - .:/app
      - /app/node_modules
