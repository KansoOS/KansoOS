name: Sync subrepo

# Déclenché par le Worker auto-draft-pr (voir .github/automation/draft-pr-worker
# dans le repo .github) à chaque push sur la branche par défaut d'un repo suivi.
# Peut aussi être lancé à la main depuis l'onglet Actions.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo GitHub source à synchroniser (nom réel du repo, pas le nom du dossier local de dev)"
        required: true
        type: choice
        options:
          - kanso-mdm-backend
          - kanso-web-dashboard
          - kanso-infra

permissions:
  contents: write

# Sérialise les synchros : deux repos qui pushent en même temps ne doivent pas
# se marcher dessus en poussant sur KansoOS en parallèle.
concurrency:
  group: kanso-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KansoOS
        uses: actions/checkout@v4

      - name: Détermine le nom du dossier de destination
        env:
          REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          case "$REPO" in
            kanso-mdm-backend) DEST=backend-mdm ;;
            kanso-web-dashboard) DEST=dashboard-web ;;
            kanso-infra) DEST=infra ;;
            *) echo "Repo inconnu: $REPO" >&2; exit 1 ;;
          esac
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      - name: Clone la dernière version de ${{ inputs.repo }}
        env:
          REPO: ${{ inputs.repo }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$DEST"
          git clone --depth 1 "https://x-access-token:${SYNC_TOKEN}@github.com/KansoOS/${REPO}.git" "$DEST"
          echo "SHA=$(git -C "$DEST" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # Métadonnées git du repo source et artefacts de build : pas leur place ici.
          rm -rf "$DEST/.git" \
                 "$DEST"/node_modules "$DEST"/*/node_modules \
                 "$DEST"/dist "$DEST"/*/dist \
                 "$DEST"/build "$DEST"/*/build \
                 "$DEST"/coverage "$DEST"/*/coverage \
                 "$DEST"/.next

      - name: Commit et push si besoin
        run: |
          set -euo pipefail
          git config user.name "kanso-sync-bot"
          git config user.email "bot@kansoos.dev"
          git add -A -- "$DEST"
          if git diff --cached --quiet; then
            echo "Rien de nouveau pour $DEST"
            exit 0
          fi
          git commit -m "sync: $DEST@$SHA"
          git push
